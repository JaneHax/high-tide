<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Tide — Puerto Sol</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f2b27a; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; z-index: 5; }
  #hud-top-left { top: 14px; left: 16px; font-size: 20px; font-weight: 700; }
  #hud-top-left .sub { font-size: 13px; font-weight: 600; opacity: .95; }
  .barwrap { width: 180px; height: 8px; background: rgba(0,0,0,.45); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .bar { height: 100%; background: #37e0a0; width: 0%; }
  .bar.low { background: #ff4d4d; }
  #hud-top-right { top: 14px; right: 16px; text-align: right; }
  #hud-stars { font-size: 26px; letter-spacing: 2px; }
  #hud-stars.hot { color: #ffc93c; }
  #hud-map { margin-top: 6px; border: 2px solid rgba(255,255,255,.7); border-radius: 6px; background: #2e7f9e; }
  #hud-healthbox { position: fixed; left: 16px; bottom: 16px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); z-index: 5; font-weight: 700; }
  #hud-weaponbox { position: fixed; right: 16px; bottom: 16px; text-align: right; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); z-index: 5; font-weight: 700; font-size: 17px; }
  #hud-job { position: fixed; left: 16px; top: 110px; max-width: 320px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; background: rgba(0,0,0,.35); padding: 10px 12px; border-radius: 8px; border-left: 4px solid #ffc93c; }
  #hud-jobtitle { font-size: 18px; font-weight: 800; }
  #hud-jobtext { font-size: 13px; margin-top: 4px; line-height: 1.35; }
  #hud-jobpay { font-size: 13px; margin-top: 6px; color: #ffc93c; font-weight: 700; }
  #hud-prompt { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,.55); padding: 8px 16px; border-radius: 20px; font-size: 16px; font-weight: 700; z-index: 5; display: none; }
  #hud-airone { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); color: #fff; background: #c22; padding: 6px 18px; border-radius: 4px; font-size: 18px; font-weight: 800; letter-spacing: 3px; z-index: 6; display: none; }
  #hud-toasts { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 5; text-align: center; pointer-events: none; }
  .toast { color: #fff; background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 16px; margin-top: 6px; font-size: 14px; font-weight: 600; display: inline-block; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(20,30,50,.55), rgba(120,60,20,.55)); color: #fff; z-index: 10; text-align: center; padding: 24px; }
  #overlay-title { font-size: 64px; font-weight: 900; letter-spacing: 8px; text-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #overlay-text { font-size: 17px; max-width: 560px; line-height: 1.5; margin-top: 12px; }
  #overlay-hint { font-size: 15px; margin-top: 22px; color: #ffe9a8; font-weight: 700; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud-top-left" class="hud">
  <div id="hud-cash">$0</div>
  <div class="sub"><span id="hud-rep">REP 0</span> · <span id="hud-reptitle">Runner</span></div>
  <div class="barwrap"><div id="hud-repbar" class="bar"></div></div>
</div>

<div id="hud-top-right" class="hud">
  <div id="hud-stars" class="stars">☆☆☆☆☆</div>
  <canvas id="hud-map" width="170" height="170"></canvas>
</div>

<div id="hud-job">
  <div id="hud-jobtitle">The Marina Errand</div>
  <div id="hud-jobtext">Walk to the pier and find what Sombra left for you.</div>
  <div id="hud-jobpay">Pays $400</div>
</div>

<div id="hud-healthbox">Health <span id="hud-health">100</span><div class="barwrap"><div id="hud-healthbar" class="bar" style="width:100%"></div></div></div>
<div id="hud-weaponbox"><div id="hud-weapon">Pistol</div><div id="hud-ammo">120 ammo</div></div>
<div id="hud-prompt"></div>
<div id="hud-airone">AIR ONE</div>
<div id="hud-toasts"></div>

<div id="overlay">
  <div id="overlay-title">HIGH TIDE</div>
  <div id="overlay-text">Puerto Sol at golden hour. Rico works for Sombra: ten jobs, the law on his tail, and a city full of cars, boats and trouble.</div>
  <div id="overlay-hint">Press Enter to start</div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
